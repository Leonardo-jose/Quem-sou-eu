<!DOCTYPE html>
<html>
<head><title>Quem Sou Eu?</title></head>
<body>
  <h1>Quem Sou Eu?</h1>

  <input id="nome" placeholder="Seu nome" />
  <button id="btnCriar">Criar sala</button>

  <p id="resultado"></p>
  <p id="aviso"></p>

  <h2>Ou entrar numa sala existente:</h2>
  <input id="codigoSala" placeholder="Código da sala" />
  <button id="btnEntrar">Entrar</button>

  <h2>Jogadores na sala:</h2>
  <ul id="listaJogadores"></ul>

  <h2>Escolha um nome para alguém adivinhar:</h2>
  <input id="nomeParaAdivinhar" list="sugestoes" autocomplete="off"
         placeholder="Ex: Naruto, Pelé, Rainha Elizabeth" />
  <datalist id="sugestoes"></datalist>
  <button id="btnEnviarNome">Enviar nome</button>
  <button id="btnSortear">Sortear do banco</button>
  <p id="progressoNomes"></p>

  <button id="btnIniciar">Iniciar jogo</button>

  <h2>Personagens dos outros jogadores:</h2>
  <ul id="listaEstadoJogo"></ul>

  <button id="btnJogarDeNovo">Jogar de novo</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // ---- sessão que sobrevive ao F5 ----
    function lerSessao() {
      try {
        return JSON.parse(sessionStorage.getItem("sessao"));
      } catch {
        return null;
      }
    }

    // O evento "connect" dispara toda vez que a conexão se estabelece:
    // na primeira carga, depois de um F5 e depois de uma queda de internet.
    socket.on("connect", () => {
      const sessao = lerSessao();
      if (sessao) socket.emit("reconectar", sessao);
    });

    socket.on("sessao-iniciada", ({ token, codigo }) => {
      sessionStorage.setItem("sessao", JSON.stringify({ token, codigo }));
      document.getElementById("resultado").textContent = "Sua sala: " + codigo;
    });

    socket.on("sessao-invalida", () => {
      sessionStorage.removeItem("sessao");
    });

    socket.on("sala-recuperada", ({ codigo }) => {
      document.getElementById("resultado").textContent = "Sua sala: " + codigo;
    });
    // ------------------------------------------

    document.getElementById("btnCriar").addEventListener("click", () => {
      const nome = document.getElementById("nome").value;
      socket.emit("criar-sala", nome);
    });

    socket.on("sala-criada", (codigo) => {
      document.getElementById("resultado").textContent = "Sua sala: " + codigo;
    });

    document.getElementById("btnEntrar").addEventListener("click", () => {
      const nome = document.getElementById("nome").value;
      const codigo = document.getElementById("codigoSala").value.toUpperCase();
      socket.emit("entrar-sala", { codigo, nome });
    });

    socket.on("lista-jogadores-atualizada", (jogadores) => {
      const lista = document.getElementById("listaJogadores");
      lista.innerHTML = "";
      jogadores.forEach((jogador) => {
        const item = document.createElement("li");
        item.textContent = jogador.conectado
          ? jogador.nome
          : `${jogador.nome} (reconectando…)`;
        lista.appendChild(item);
      });
    });

    document.getElementById("btnEnviarNome").addEventListener("click", () => {
      const texto = document.getElementById("nomeParaAdivinhar").value;
      socket.emit("enviar-nome", texto);
    });

    // ---- NOVO: sugestões enquanto digita ----
    const campoNome = document.getElementById("nomeParaAdivinhar");
    const listaSugestoes = document.getElementById("sugestoes");
    let timerSugestao;

    campoNome.addEventListener("input", () => {
      // "debounce": cada tecla cancela o pedido anterior e agenda um novo.
      // Assim o servidor só é consultado quando a pessoa para de digitar.
      clearTimeout(timerSugestao);

      const texto = campoNome.value.trim();
      if (texto.length < 2) {
        listaSugestoes.innerHTML = "";
        return;
      }

      timerSugestao = setTimeout(() => {
        socket.emit("buscar-sugestoes", texto);
      }, 250);
    });

    socket.on("sugestoes", (nomes) => {
      listaSugestoes.innerHTML = "";
      nomes.forEach((nome) => {
        const opcao = document.createElement("option");
        opcao.value = nome; // .value (e não innerHTML) trata o nome como texto puro
        listaSugestoes.appendChild(opcao);
      });
    });

    // ---- NOVO: sortear um nome do banco ----
    document.getElementById("btnSortear").addEventListener("click", () => {
      socket.emit("sortear-do-banco");
    });

    // O nome sorteado só preenche o campo: a pessoa ainda precisa clicar em
    // "Enviar nome", então pode aceitar, editar ou sortear outro.
    socket.on("nome-sorteado", (nome) => {
      campoNome.value = nome;
    });
    // ------------------------------------------

    socket.on("progresso-nomes", ({ enviados, total }) => {
      document.getElementById("progressoNomes").textContent =
        `Nomes enviados: ${enviados} de ${total}`;
    });

    document.getElementById("btnIniciar").addEventListener("click", () => {
      socket.emit("iniciar-jogo");
    });

    document.getElementById("btnJogarDeNovo").addEventListener("click", () => {
      if (confirm("Reiniciar a rodada para todos?")) {
        socket.emit("jogar-de-novo");
      }
    });

    socket.on("estado-do-jogo", (jogadores) => {
      const lista = document.getElementById("listaEstadoJogo");
      lista.innerHTML = "";

      jogadores.forEach((jogador) => {
        const item = document.createElement("li");
        const sufixo = jogador.conectado ? "" : " (reconectando…)";

        if (jogador.souEu) {
          item.textContent = jogador.revelado
            ? `${jogador.nome} (você) — você era: ${jogador.identidade} 🎉`
            : `${jogador.nome} (você) — identidade OCULTA`;
        } else {
          item.textContent = `${jogador.nome} é: ${jogador.identidade}${sufixo}`;

          if (jogador.revelado) {
            item.textContent += " ✔ revelado";
          } else {
            const botao = document.createElement("button");
            botao.textContent = "Revelar";
            botao.addEventListener("click", () => {
              if (confirm(`Confirma que ${jogador.nome} acertou quem é?`)) {
                socket.emit("revelar-jogador", jogador.id);
              }
            });
            item.appendChild(document.createTextNode(" "));
            item.appendChild(botao);
          }
        }

        lista.appendChild(item);
      });
    });

    socket.on("voltou-ao-lobby", () => {
      document.getElementById("listaEstadoJogo").innerHTML = "";
      campoNome.value = "";
      listaSugestoes.innerHTML = "";
    });

    socket.on("aviso", (mensagem) => {
      document.getElementById("aviso").textContent = mensagem;
    });

    socket.on("erro", (mensagem) => {
      alert(mensagem);
    });
  </script>
</body>
</html>
